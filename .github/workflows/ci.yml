name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Trust verification suite
        run: npm run trust:verify

      - name: Typo-tolerant search suite
        run: npm run typo:verify

      - name: Catalog data suite
        run: npm run data:verify

      - name: Matching engine suite
        run: npm run match:verify

      - name: Performance suite
        run: npm run perf:verify

      - name: Marketplace provider suite
        run: npm run providers:verify
